[settings.cargo]
binstall_only = false

[tools]
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.149"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
"cargo:bacon" = "3.26.0"
"cargo:cargo-about" = "0.9.2"
"cargo:cargo-audit" = "0.22.1"
"cargo:cargo-edit" = "0.13.8"
"cargo:cargo-toml-lint" = "0.1.1"
# "pypi:reuse" = "6.2.0"
# "pypi:texthooks" = "1.0.0"
cocogitto = "7.0.0"
gitleaks = "8.30.1"
hk = { version = "2.8.1", workflow = "release.yml" }
jq = "1.8"
mbx = { version = "1.27.0", workflow = "release.yml@refs/heads/main" }
mdbook = "0.5.4"
"npm:prettier" = "3.9.10"
pkl = "0.32.2"
"pypi:texthooks" = "1.0.0"
python = "3.13"
rust = { version = "1.59.0", profile = "minimal", mr_boxington = true, components = "rustfmt, clippy" }
taplo = "0.10.0"
vale = "3.25.1"
yamllint = "1.38.0"
