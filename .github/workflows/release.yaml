name: Semantic Release
on:
  workflow_call:
    inputs:
      new_release:
        description: "Whether or not a new release needs to be published"
        type: boolean
      prerelease:
        description: "Is this a prerelease?"
        type: boolean
  workflow_dispatch:
    inputs:
      new_release:
        description: "Whether or not a new release needs to be published"
        type: boolean
      prerelease:
        description: "Is this a prerelease?"
        type: boolean
env:
  RUST_BACKTRACE: 1
concurrency:
  group: ${{ github.workflow }}
jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-26.04
    timeout-minutes: 600
    permissions:
      contents: write
    if: ${{ inputs.new_release }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup mise-en-place
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: true
          experimental: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache: false
      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_KEY_PASSPHRASE }}
          fingerprint: ${{ secrets.GPG_SUBKEY_FINGERPRINT }}
          trust_level: 5
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: false
          git_committer_name: ${{ vars.GIT_AUTHOR_NAME }}
          git_committer_email: ${{ vars.GIT_AUTHOR_EMAIL }}
      - name: Set `prerelease` Flag if necessary
        id: prerelease_flag
        if: ${{inputs.prerelease}}
        run: echo "prerelease_flag=--pre" >>"$GITHUB_OUTPUT"
      - name: Get the next version number
        run: |
          args=(--dry-run --auto)
          [ -n "$PRERELEASE_FLAG" ] && args+=("$PRERELEASE_FLAG")
          echo "NEXT_VERSION=$(cog bump "${args[@]}")" >>"$GITHUB_ENV"
        env:
          STEPS_PRERELEASE_FLAG_OUTPUTS_PRERELEASE_FLAG: ${{ steps.prerelease_flag.outputs.prerelease_flag }}
      - name: Bump Version
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.SEMREL_CRATES_IO }}
          STEPS_PRERELEASE_FLAG_OUTPUTS_PRERELEASE_FLAG: ${{ steps.prerelease_flag.outputs.prerelease_flag }}
        run: |
          args=(--auto --skip-ci)
          [ -n "$PRERELEASE_FLAG" ] && args+=("$PRERELEASE_FLAG")
          cog bump "${args[@]}"
        shell: bash
      - name: Generate Changelog
        run: cog changelog --at "${NEXT_VERSION}" | tee RELEASE_NOTES
      - name: Create a GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=()
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
          gh release create "v${NEXT_VERSION}" \
            --notes-file RELEASE_NOTES \
            --title "v${NEXT_VERSION}" \
            "${args[@]}"
        shell: bash
