name: Semantic Release
on:
  workflow_call:
    inputs:
      new_release:
        description: "Whether or not a new release needs to be published"
        type: boolean
      prerelease:
        description: "Is this a prerelease?"
        type: boolean
  workflow_dispatch:
    inputs:
      new_release:
        description: "Whether or not a new release needs to be published"
        type: boolean
      prerelease:
        description: "Is this a prerelease?"
        type: boolean
env:
  RUST_BACKTRACE: 1
concurrency:
  group: ${{ github.workflow }}
permissions:
  contents: write
jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: ${{ inputs.new_release }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup mise-en-place
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: true
          experimental: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache: false
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_KEY_PASSPHRASE }}
          fingerprint: ${{ secrets.GPG_SUBKEY_FINGERPRINT }}
          trust_level: 5
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: false
          git_committer_name: ${{ vars.GIT_AUTHOR_NAME }}
          git_committer_email: ${{ vars.GIT_AUTHOR_EMAIL }}
      - name: Set prerelease flag if necessary
        id: prerelease_flag
        if: ${{inputs.prerelease}}
        run: echo "prerelease_flag=--pre" >>"$GITHUB_OUTPUT"
      - name: Get the next version number
        run: echo "NEXT_VERSION=$(cog bump --dry-run --auto ${STEPS_PRERELEASE_FLAG_OUTPUTS_PRERELEASE_FLAG})" >>"$GITHUB_ENV"
        env:
          STEPS_PRERELEASE_FLAG_OUTPUTS_PRERELEASE_FLAG: ${{ steps.prerelease_flag.outputs.prerelease_flag }}
      - name: Bump the version
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.SEMREL_CRATES_IO }}
          STEPS_PRERELEASE_FLAG_OUTPUTS_PRERELEASE_FLAG: ${{ steps.prerelease_flag.outputs.prerelease_flag }}
        run: cog bump --auto ${STEPS_PRERELEASE_FLAG_OUTPUTS_PRERELEASE_FLAG} --skip-ci
        shell: bash
      - name: Generate the Changelog
        run: cog changelog --at ${NEXT_VERSION} | tee RELEASE_NOTES
      - name: Create a GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=()
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
          gh release create "v${NEXT_VERSION}" \
            --notes-file RELEASE_NOTES \
            --title "v${NEXT_VERSION}" \
            "${args[@]}"
        shell: bash
