name: Next version release check
on:
  workflow_call:
    inputs:
      base_ref:
        description: "The branch the PR is targeted to"
        type: string
        required: true
    outputs:
      new_release:
        description: "Whether or not a new release needs to be published"
        value: ${{jobs.preflight.outputs.new_release}}
      prerelease:
        description: "Whether or not a new release needs to be published"
        value: ${{jobs.preflight.outputs.prerelease}}
permissions:
  contents: read
jobs:
  preflight:
    name: Preflight Checks for Release
    runs-on: ubuntu-latest
    outputs:
      new_release: ${{steps.new_release_check.outputs.new_release}}
      prerelease: ${{steps.new_release_check.outputs.prerelease}}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup mise-en-place
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: true
          experimental: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Preflight checks for release
        id: new_release_check
        run: mise run get-next-version ${INPUTS_BASE_REF}
        shell: bash
        env:
          INPUTS_BASE_REF: ${{inputs.base_ref}}
