# SPDX-License-Identifier: 0BSD
name: Build Matrix
on:
  workflow_call:
    secrets:
      GIST_SECRET:
        required: true
        description: "A GitHub Personal Access Token with Gist editing permissions"
      GIST_KEY:
        required: true
        description: "The key for the Gist holding the badge information"
    inputs:
      source_changed:
        description: "Whether source code has changed"
        type: boolean
        required: true
permissions:
  contents: read
env:
  MINIMUM_WAIT: 3
  MAXIMUM_WAIT: 10
jobs:
  ci:
    name: Build Check - ${{matrix.rust}} on ${{matrix.os}}
    runs-on: ${{matrix.os}}
    defaults:
      run:
        shell: bash
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        rust:
          - stable
          - beta
          - nightly
          - 1.59.0 # MSRV
        os:
          - ubuntu-26.04
          - windows-2025
          - macos-26
        include:
          - os: windows-2025
            logo: windows
          - os: macos-26
            logo: macos
          - os: ubuntu-26.04
            logo: ubuntu
          - rust: stable
            label: stable
          - rust: beta
            label: beta
          - rust: nightly
            label: nightly
          - rust: 1.59.0
            label: msrv
    if: |
      ${{github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && inputs.source_changed == true) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            static.rust-lang.org:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise-en-place
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: true
          experimental: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          mise_toml: |
            [tools]
            rust = {version = "${{matrix.rust}}", profile = "default"}
            "aqua:nextest-rs/nextest/cargo-nextest" = "0.9.129"
      - name: Cargo Build
        run: mise run build
      - name: Cargo Test
        run: mise run test
      - name: Cargo Format Check
        run: mise run format-check
      - name: Cargo Lint Check
        run: mise run lint
      - name: Wait before badge creation
        uses: AliSajid/random-wait-action@933d3635c56777d240b67abe794f1a5f7bdfd063 # v2.12.0
        with:
          minimum: ${{env.MINIMUM_WAIT}}
          maximum: ${{env.MAXIMUM_WAIT}}
      - name: Load OS Logo
        shell: bash
        env:
          LOGO: ${{ matrix.logo }}
        run: |
          {
            echo "LOGO_SVG<<EOF"
            tr -d '\n' < ".github/logos/${LOGO}.svg"
            echo
            echo "EOF"
          } >> "$GITHUB_ENV"
      - name: Create Badge - Success
        if: ${{ success() }}
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{secrets.GIST_SECRET}}
          gistID: ${{secrets.GIST_KEY}}
          filename: ${{matrix.os}}-${{matrix.label}}.json
          label: Build
          labelColor: lightgrey
          logoSvg: ${{ env.LOGO_SVG }}
          message: Succeeded
          color: green
      - name: Create Badge - Failure
        if: ${{ failure() }}
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{secrets.GIST_SECRET}}
          gistID: ${{secrets.GIST_KEY}}
          filename: ${{matrix.os}}-${{matrix.label}}.json
          labelColor: lightgrey
          logoSvg: ${{ env.LOGO_SVG }}
          label: Build
          message: Failed
          isError: true
      - name: Set Output
        id: set-output
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "success=${JOB_STATUS}" >> "$GITHUB_OUTPUT"
        shell: bash
