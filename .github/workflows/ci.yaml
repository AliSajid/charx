name: Continuous Integration
on:
  push:
  pull_request:
    branches:
      - main
      - next
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/next' }}
permissions:
  contents: read
env:
  RUST_BACKTRACE: 1
  MINIMUM_WAIT: 3
  MAXIMUM_WAIT: 10
jobs:
  check_changed_dirs:
    name: Check Changed Directories
    runs-on: ubuntu-26.04
    timeout-minutes: 600
    outputs:
      source_changed: ${{steps.changed_dirs.outputs.source}}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Changed Directories
        id: changed_dirs
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.ref }}
          filters: |
            source:
              - "src/**/*"
              - "tests/**/*"
              - "examples/**/*"
              - "Cargo.toml"
              - "Cargo.lock"
  build-matrix:
    name: Build Matrix
    needs:
      - check_changed_dirs
    uses: $/.github/workflows/build-matrix.yaml
    secrets:
      GIST_SECRET: ${{ secrets.ACTIONS_PAT_GITHUB }}
      GIST_KEY: ${{ vars.GIST_KEY }}
    with:
      source_changed: ${{ needs.check_changed_dirs.outputs.source_changed == 'true' }}
  coverage:
    name: Code Coverage
    secrets:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    needs:
      - check_changed_dirs
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request') ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/next' || github.ref == 'refs/heads/main'))
    uses: $/.github/workflows/coverage.yaml
  get_next_version:
    name: Get Next Version
    needs:
      - check_changed_dirs
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/next' || github.ref == 'refs/heads/main')
    uses: $/.github/workflows/get_next_version.yaml
    with:
      base_ref: ${{github.ref_name}}
  release:
    name: Release
    needs:
      - get_next_version
    if: needs.get_next_version.outputs.new_release == 'true'
    permissions:
      contents: write
    uses: $/.github/workflows/release.yaml
    secrets:
      GPG_KEY_PASSPHRASE: ${{ secrets.GPG_KEY_PASSPHRASE }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_SUBKEY_FINGERPRINT: ${{ secrets.GPG_SUBKEY_FINGERPRINT }}
      SEMREL_CRATES_IO: ${{ secrets.SEMREL_CRATES_IO }}
    with:
      new_release: true
      prerelease: ${{ needs.get_next_version.outputs.prerelease == 'true' }}
