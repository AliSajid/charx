name: Continuous integration
on:
  push:
  pull_request:
    branches:
      - main
      - next
    types:
      - closed
  workflow_dispatch:
concurrency:
  group: ${{github.workflow}}-${{github.event_name}}-${{github.ref}}
  cancel-in-progress: true
permissions:
  contents: read
env:
  GIST_KEY: d52f912107d7609656370db9d741596c # pragma: allowlist secret
  RUST_BACKTRACE: 1
  MINIMUM_WAIT: 3
  MAXIMUM_WAIT: 10
jobs:
  check_changed_dirs:
    name: Check Changed Directories
    runs-on: ubuntu-latest
    outputs:
      source_changed: ${{steps.changed_dirs.outputs.source}}
      tests_changed: ${{steps.changed_dirs.outputs.tests}}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Dump github.event context
        env:
          DUMPABLE: ${{toJson(github)}}
        run: echo "$DUMPABLE"
      - name: Check changed directories
        id: changed_dirs
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          base: ${{ github.ref }}
          filters: |
            source:
              - "src/**/*"
              - "tests/**/*"
              - "examples/**/*"
              - "Cargo.toml"
              - "Cargo.lock"
            tests:
              - "tests/**/*"
  build-matrix:
    name: Build Matrix
    needs:
      - check_changed_dirs
    uses: ./.github/workflows/build-matrix.yaml
    with:
      source_changed: ${{ needs.check_changed_dirs.outputs.source_changed == 'true' }}
  coverage:
    name: Code Coverage
    needs:
      - check_changed_dirs
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.check_changed_dirs.outputs.source_changed == 'true' ||
      needs.check_changed_dirs.outputs.tests_changed == 'true'
    uses: ./.github/workflows/coverage.yaml
  get_next_version:
    name: Get Next Version
    needs:
      - check_changed_dirs
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
    uses: ./.github/workflows/get_next_version.yaml
    with:
      base_ref: ${{github.base_ref}}
