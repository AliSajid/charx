name: Continuous integration
on:
  push:
  pull_request:
    branches:
      - main
      - next
    types:
      - closed
  workflow_dispatch:
concurrency:
  group: ${{github.workflow}}-${{github.event_name}}-${{github.ref}}
  cancel-in-progress: true
permissions:
  contents: read
env:
  GIST_KEY: d52f912107d7609656370db9d741596c # pragma: allowlist secret
  RUST_BACKTRACE: 1
  MINIMUM_WAIT: 3
  MAXIMUM_WAIT: 10
jobs:
  check_changed_dirs:
    name: Check Changed Directories
    runs-on: ubuntu-latest
    outputs:
      source_changed: ${{steps.changed_dirs.outputs.source}}
      tests_changed: ${{steps.changed_dirs.outputs.tests}}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dump github.event context
        env:
          DUMPABLE: ${{toJson(github.event)}}
        run: echo "$DUMPABLE"
      - name: Check changed directories
        id: changed_dirs
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.ref }}
          filters: |
            source:
              - "src/**/*"
              - "tests/**/*"
              - "examples/**/*"
              - "Cargo.toml"
              - "Cargo.lock"
            tests:
              - "tests/**/*"
  build-matrix:
    name: Build Matrix
    needs:
      - check_changed_dirs
    uses: $/.github/workflows/build-matrix.yaml
    with:
      source_changed: ${{ needs.check_changed_dirs.outputs.source_changed == 'true' }}
  coverage:
    name: Code Coverage
    needs:
      - check_changed_dirs
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.check_changed_dirs.outputs.source_changed == 'true' ||
      needs.check_changed_dirs.outputs.tests_changed == 'true'
    uses: $/.github/workflows/coverage.yaml
  get_next_version:
    name: Get Next Version
    needs:
      - check_changed_dirs
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
    uses: $/.github/workflows/get_next_version.yaml
    with:
      base_ref: ${{github.base_ref}}
